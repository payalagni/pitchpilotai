[tool.poetry]
name = "pitchpilot-ai"
version = "1.0.0"
description = "Strategic Pitch Deck Architect - AI Agent for creating investor pitch decks"
authors = ["Payal Sharma <payalagnihotri17@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
google-generativeai = "^0.3.0"
python-pptx = "^0.6.23"
PyPDF2 = "^3.0.0"
python-docx = "^1.1.0"
Pillow = "^10.0.0"
google-search-results = "^2.4.0"
streamlit = "^1.28.0"
pydantic = "^2.0.0"
sqlalchemy = "^2.0.0"

[tool.poetry.dev-dependencies]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.vercel]
entrypoint = "pitchpilot-mvp/backend/main.py"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
